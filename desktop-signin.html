<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to SprinkFlow</title>
  <meta name="description" content="Sign in to activate the SprinkFlow desktop app." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="./assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .acct-wrap { max-width: 480px; margin: 0 auto; padding: 56px 22px 90px; }
    .acct-wrap h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 6px; text-align: center; }
    .acct-sub { color: var(--muted); text-align: center; margin: 0 0 26px; }
    .acct-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .acct-card label { display: block; font: 600 0.8rem Inter; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.03em; text-transform: uppercase; }
    .acct-card input { width: 100%; box-sizing: border-box; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: 500 1rem Inter; padding: 12px 14px; }
    .acct-card input:focus { border-color: var(--accent); outline: none; }
    .acct-btn { width: 100%; margin-top: 18px; border: 0; border-radius: 12px; padding: 14px; font: 700 1rem 'Space Grotesk'; cursor: pointer; background: var(--grad-fire); color: #1a0d06; }
    .acct-btn:disabled { opacity: 0.6; cursor: default; }
    .acct-note { margin-top: 14px; font: 500 0.9rem/1.5 Inter; color: var(--muted); text-align: center; min-height: 1.2em; }
    .acct-note.err { color: #ff9b85; }
    .acct-note.ok { color: var(--ok); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img src="./assets/logo.png" alt="" class="brand-mark" /><span class="brand-name">SprinkFlow</span></a>
  </header>

  <main class="acct-wrap">
    <h1>Sign in</h1>
    <p class="acct-sub">Sign in to activate the SprinkFlow app on this computer.</p>

    <!--
      Desktop-app sign-in hop: the app opens this page with ?redirect=<loopback>&state=<nonce>,
      the user signs in HERE (so the browser's password manager autofills), and we hand the
      short-lived session token back to the app over the loopback redirect. Only
      http://localhost / http://127.0.0.1 redirect targets are ever honored.
    -->
    <form class="acct-card" id="signinForm" method="post" action="#">
      <label for="dsEmail">Email</label>
      <input id="dsEmail" name="email" type="email" autocomplete="username email" placeholder="you@company.com" required />
      <label for="dsPassword">Password</label>
      <input id="dsPassword" name="password" type="password" autocomplete="current-password" placeholder="Your SprinkFlow password" required />
      <button class="acct-btn" id="dsSubmit" type="submit">Sign in &amp; return to the app</button>
      <p class="acct-note" id="dsNote">Use the same login as your SprinkFlow account.</p>
    </form>

    <div class="acct-card hidden" id="doneCard">
      <p class="acct-note ok" style="font-size:1.05rem">You're signed in.</p>
      <p class="acct-note">Return to the SprinkFlow app — it finishes activating automatically. You can close this tab.</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var SB_URL = "https://aebghirpjiwiergkafej.supabase.co";
      var SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlYmdoaXJwaml3aWVyZ2thZmVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjA0NTQsImV4cCI6MjA5NTg5NjQ1NH0.ogDc26YGo3AEAZZcPII_p3htPml4pjQa4vOyYAU1sSg";

      var params = new URLSearchParams(window.location.search);
      var redirect = params.get("redirect") || "";
      var state = params.get("state") || "";
      var note = document.getElementById("dsNote");
      var form = document.getElementById("signinForm");
      var submit = document.getElementById("dsSubmit");

      function loopbackOnly(url) {
        return /^http:\/\/(localhost|127\.0\.0\.1):\d+\//.test(url);
      }

      if (!redirect || !loopbackOnly(redirect) || !state) {
        note.textContent = "Open this page from the SprinkFlow app's license screen (Sign in with Browser).";
        note.className = "acct-note err";
        submit.disabled = true;
        return;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        submit.disabled = true;
        note.textContent = "Signing in…";
        note.className = "acct-note";
        try {
          var res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
            method: "POST",
            headers: { "apikey": SB_ANON, "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("dsEmail").value.trim(),
              password: document.getElementById("dsPassword").value
            })
          });
          var data = await res.json();
          if (!res.ok || !data.access_token) {
            var msg = (data && (data.error_description || data.msg)) || "Sign-in failed.";
            if (/invalid login credentials/i.test(msg)) { msg = "Email or password is incorrect."; }
            note.textContent = msg;
            note.className = "acct-note err";
            submit.disabled = false;
            return;
          }
          document.getElementById("signinForm").classList.add("hidden");
          document.getElementById("doneCard").classList.remove("hidden");
          window.location.href = redirect + "?state=" + encodeURIComponent(state)
            + "&token=" + encodeURIComponent(data.access_token);
        } catch (err) {
          note.textContent = "Could not reach the sign-in service. Check your connection.";
          note.className = "acct-note err";
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
