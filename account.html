<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Account — SprinkFlow</title>
  <meta name="description" content="Manage your SprinkFlow account and subscription." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://sprinkflow.studio/account.html" />
  <link rel="icon" href="./assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .acct-wrap { max-width: 480px; margin: 0 auto; padding: 56px 22px 90px; }
    .acct-wrap h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 6px; text-align: center; }
    .acct-sub { color: var(--muted); text-align: center; margin: 0 0 26px; }
    .acct-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .acct-card label { display: block; font: 600 0.8rem Inter; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.03em; text-transform: uppercase; }
    .acct-card input { width: 100%; box-sizing: border-box; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: 500 1rem Inter; padding: 12px 14px; }
    .acct-card input:focus { border-color: var(--accent); outline: none; }
    .acct-btn { width: 100%; margin-top: 18px; border: 0; border-radius: 12px; padding: 14px; font: 700 1rem 'Space Grotesk'; cursor: pointer; background: var(--grad-fire); color: #1a0d06; }
    .acct-btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
    .acct-btn:disabled { opacity: 0.6; cursor: default; }
    .acct-note { margin-top: 14px; font: 500 0.9rem/1.5 Inter; color: var(--muted); text-align: center; min-height: 1.2em; }
    .acct-note.err { color: #ff9b85; }
    .status-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .status-row:last-of-type { border-bottom: 0; }
    .status-row .k { color: var(--muted); font: 600 0.85rem Inter; }
    .status-row .v { color: var(--ink); font: 600 0.95rem Inter; text-align: right; }
    .pill { display: inline-block; padding: 5px 12px; border-radius: 999px; font: 700 0.8rem 'Space Grotesk'; }
    .pill.good { background: rgba(61, 220, 151, 0.14); color: var(--ok); border: 1px solid rgba(61, 220, 151, 0.4); }
    .pill.warn { background: rgba(255, 176, 58, 0.14); color: var(--accent); border: 1px solid rgba(255, 176, 58, 0.4); }
    .pill.bad { background: rgba(255, 90, 79, 0.14); color: #ff9b85; border: 1px solid rgba(255, 90, 79, 0.4); }
    .acct-msg { color: var(--muted); font: 500 0.92rem/1.55 Inter; margin: 14px 0 4px; }
    .hidden { display: none !important; }
    .signout { margin-top: 16px; text-align: center; }
    .signout button { background: none; border: 0; color: var(--muted); font: 600 0.85rem Inter; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img src="./assets/logo.png" alt="" class="brand-mark" /><span class="brand-name">SprinkFlow</span></a>
    <nav class="nav-links"><a href="/tools/">Free tools</a><a href="/#download">Download</a></nav>
  </header>

  <main class="acct-wrap">
    <h1>Your Account</h1>
    <p class="acct-sub">Manage your SprinkFlow subscription.</p>

    <!-- signed OUT -->
    <div class="acct-card" id="loginCard">
      <label for="acEmail">Email</label>
      <input id="acEmail" type="email" autocomplete="email" placeholder="you@company.com" />
      <label for="acPassword">Password</label>
      <input id="acPassword" type="password" autocomplete="current-password" placeholder="Your SprinkFlow password" />
      <button class="acct-btn" id="acSignIn" type="button">Sign in</button>
      <p class="acct-note" id="loginNote">Use the same login as the SprinkFlow app.</p>
    </div>

    <!-- signed IN -->
    <div class="acct-card hidden" id="acctCard">
      <div class="status-row"><span class="k">Signed in as</span><span class="v" id="acWho">—</span></div>
      <div class="status-row"><span class="k">Status</span><span class="v"><span class="pill" id="acPill">—</span></span></div>
      <div class="status-row"><span class="k">Plan</span><span class="v" id="acPlan">—</span></div>
      <p class="acct-msg" id="acMsg"></p>
      <button class="acct-btn hidden" id="acSubscribe" type="button">Subscribe</button>
      <button class="acct-btn ghost hidden" id="acPortal" type="button">Manage billing (payment method, invoices, cancel)</button>
      <p class="acct-note" id="acctNote"></p>
      <div class="signout"><button id="acSignOut" type="button">Sign out</button></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand"><img src="./assets/logo.png" alt="" /><span>SprinkFlow</span></div>
    <div class="footer-by">A Calculated Fire Suppression product</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";
    var SUPABASE_URL = "https://aebghirpjiwiergkafej.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlYmdoaXJwaml3aWVyZ2thZmVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjA0NTQsImV4cCI6MjA5NTg5NjQ1NH0.ogDc26YGo3AEAZZcPII_p3htPml4pjQa4vOyYAU1sSg";
    var CLOUD_API = "https://sprinkflow-cloud-api.onrender.com";
    var supa = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    var $ = function (id) { return document.getElementById(id); };

    function note(id, text, err) { var el = $(id); el.textContent = text || ""; el.classList.toggle("err", !!err); }

    function pillFor(status) {
      var map = {
        active: ["good", "Subscription active"],
        beta: ["warn", "Beta access"],
        trial: ["warn", "Trial"],
        grace: ["warn", "Payment grace period"],
        past_due: ["bad", "Payment past due"],
        expired: ["bad", "Expired"],
        revoked: ["bad", "Revoked"],
      };
      return map[status] || ["warn", status || "Unknown"];
    }

    async function api(path, options, token) {
      var response = await fetch(CLOUD_API + path, Object.assign({
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      }, options || {}));
      var data = await response.json().catch(function () { return {}; });
      if (!response.ok) throw new Error(data.detail || data.error || ("Request failed (" + response.status + ")"));
      return data;
    }

    async function renderAccount(session) {
      $("loginCard").classList.add("hidden");
      $("acctCard").classList.remove("hidden");
      $("acWho").textContent = session.user && session.user.email || "—";
      note("acctNote", "Loading your subscription…");
      try {
        var s = await api("/license/status", { method: "GET" }, session.access_token);
        var pill = pillFor(s.status);
        $("acPill").className = "pill " + pill[0];
        $("acPill").textContent = s.status_label || pill[1];
        $("acPlan").textContent = s.plan === "sprinkflow_pro" ? "SprinkFlow Membership" : (s.plan || "—");
        $("acMsg").textContent = s.message || "";
        var subscribed = s.status === "active" || s.status === "grace" || s.status === "past_due";
        $("acPortal").classList.toggle("hidden", !subscribed);
        $("acSubscribe").classList.toggle("hidden", subscribed);
        note("acctNote", "");
      } catch (e) {
        note("acctNote", e.message || "Could not load subscription.", true);
      }
    }

    async function withSession(fn) {
      var res = await supa.auth.getSession();
      var session = res.data && res.data.session;
      if (!session) { $("acctCard").classList.add("hidden"); $("loginCard").classList.remove("hidden"); return; }
      return fn(session);
    }

    $("acSignIn").onclick = async function () {
      var btn = this;
      btn.disabled = true;
      note("loginNote", "Signing in…");
      try {
        var res = await supa.auth.signInWithPassword({ email: $("acEmail").value.trim(), password: $("acPassword").value });
        if (res.error) throw res.error;
        await renderAccount(res.data.session);
      } catch (e) {
        note("loginNote", e.message === "Invalid login credentials" ? "That email/password combo didn't match." : (e.message || "Sign-in failed."), true);
      }
      btn.disabled = false;
    };

    $("acPassword").addEventListener("keydown", function (e) { if (e.key === "Enter") $("acSignIn").click(); });

    $("acPortal").onclick = function () {
      var btn = this;
      btn.disabled = true;
      note("acctNote", "Opening the secure billing portal…");
      withSession(async function (session) {
        try {
          var d = await api("/billing/create-portal-session", { method: "POST", body: "{}" }, session.access_token);
          if (d.url) { window.location.href = d.url; return; }
          throw new Error("No portal URL returned.");
        } catch (e) { note("acctNote", e.message, true); btn.disabled = false; }
      });
    };

    $("acSubscribe").onclick = function () {
      var btn = this;
      btn.disabled = true;
      note("acctNote", "Opening secure checkout…");
      withSession(async function (session) {
        try {
          var d = await api("/billing/create-checkout-session", { method: "POST", body: "{}" }, session.access_token);
          if (d.url) { window.location.href = d.url; return; }
          throw new Error("No checkout URL returned.");
        } catch (e) { note("acctNote", e.message, true); btn.disabled = false; }
      });
    };

    $("acSignOut").onclick = async function () {
      await supa.auth.signOut();
      $("acctCard").classList.add("hidden");
      $("loginCard").classList.remove("hidden");
      note("loginNote", "Signed out.");
    };

    // auto-restore session on load
    withSession(renderAccount);
  })();
  </script>
</body>
</html>
